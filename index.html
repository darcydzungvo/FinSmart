<script>
const state={page:'home',selfieStep:0,selfie:{confidence:3,save:'Thỉnh thoảng',spend:'Cân bằng',goal:'Quỹ khẩn cấp'},lessonStep:0,quizAnswer:null,quizChecked:false,alloc:[2400000,1600000,800000,1200000,800000,1200000],scenario:null,completed:false,points:0,investStep:0,investLessonsSubstep:0,investPick:null,investChecked:false,investDone:false,trackDone:[false,false],lastCompletedTrack:null,stockPct:40,bondPct:30,investScenario:'drop',matchPick:null};
const fmt=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
// One shared virtual ledger. Balances and transactions are illustrative only.
const accounts={everyday:8000000,savings:0,investment:0};
const accountLabels={everyday:'Tài khoản thanh toán',savings:'Tài khoản tiết kiệm',investment:'Tài khoản đầu tư'};
const accountIcons={everyday:'💳',savings:'🐷',investment:'📈'};
const transactions=[{type:'income',from:null,to:'everyday',amount:8000000,description:'Lương tháng đầu tiên (tiền ảo)',month:1}];
const moneyState={month:1,budgetApplied:false,from:'everyday',to:'savings',amount:'500000',message:'',account:'everyday'};
const validAccounts=Object.keys(accounts);
const totalMoney=()=>validAccounts.reduce((sum,id)=>sum+accounts[id],0);
const transactionType=t=>t.type==='income'?'Thu nhập':t.type==='expense'?'Chi tiêu':t.type==='interest'?'Lãi tiết kiệm':t.type==='transfer'?'Chuyển tiền':'Giao dịch';
const transactionLines=id=>transactions.filter(t=>t.from===id||t.to===id).slice().reverse();
function record(type,from,to,amount,description){transactions.push({type,from,to,amount,description,month:moneyState.month});}
function transferFunds(from,to,amount,description='Chuyển tiền giữa các tài khoản'){
  if(!validAccounts.includes(from)||!validAccounts.includes(to)||from===to||!Number.isSafeInteger(amount)||amount<=0)return 'Vui lòng chọn hai tài khoản khác nhau và số tiền hợp lệ.';
  if(accounts[from]<amount)return 'Số dư tài khoản nguồn không đủ.';
  accounts[from]-=amount;accounts[to]+=amount;record('transfer',from,to,amount,description);return '';
}
function performTransfer(){const raw=String(moneyState.amount).trim();const amount=Number(raw);
 const err=!/^\d+$/.test(raw)?'Vui lòng nhập số tiền bằng VND, không có dấu phân cách.':transferFunds(moneyState.from,moneyState.to,amount);
 moneyState.message=err||'Đã chuyển '+fmt(amount)+' bằng tiền ảo.';render();}
function payExpense(){const raw=String(moneyState.amount).trim();const amount=Number(raw);
 if(!/^\d+$/.test(raw)||!Number.isSafeInteger(amount)||amount<=0){moneyState.message='Nhập số VND hợp lệ.';render();return}
 if(accounts.everyday<amount){moneyState.message='Tài khoản thanh toán không đủ số dư.';render();return}
 accounts.everyday-=amount;record('expense','everyday',null,amount,'Khoản chi mô phỏng');moneyState.message='Đã ghi chi tiêu ảo '+fmt(amount);render();}
function applyBudget(){
 if(moneyState.budgetApplied){moneyState.message='Bạn đã áp dụng kế hoạch tháng này. Không ghi sổ lần thứ hai.';render();return}
 const total=state.alloc.reduce((a,b)=>a+b,0);
 if(total>8000000){moneyState.message='Kế hoạch vượt lương 8 triệu. Hãy giảm phân bổ trước khi áp dụng.';render();return}
 if(accounts.everyday<8000000){moneyState.message='Tài khoản thanh toán không còn đủ 8 triệu để áp dụng toàn bộ kế hoạch. Có thể thực hành chuyển tiền thủ công.';render();return}
 const expense=state.alloc.reduce((sum,v,i)=>sum+([3,5].includes(i)?0:v),0);
 accounts.everyday-=expense;record('expense','everyday',null,expense,'Chi tiêu theo kế hoạch tháng đầu tiên');
 if(state.alloc[3])transferFunds('everyday','savings',state.alloc[3],'Trích quỹ khẩn cấp từ ngân sách');
 if(state.alloc[5])transferFunds('everyday','investment',state.alloc[5],'Dành vốn đầu tư từ ngân sách');
 moneyState.budgetApplied=true;moneyState.message='Kế hoạch đã ghi vào các tài khoản ảo.';go('labhome');}
function addInterest(){if(moneyState.month>=12){moneyState.message='Mô phỏng giới hạn 12 tháng.';render();return}
 moneyState.month++;
 const interest=Math.round(accounts.savings*(0.04/12));
 if(interest>0){accounts.savings+=interest;record('interest',null,'savings',interest,'Lãi tiết kiệm minh hoạ 4%/năm, tính theo tháng');}
 moneyState.message=interest?'Đã sang tháng '+moneyState.month+' và cộng lãi ảo '+fmt(interest):'Đã sang tháng '+moneyState.month+'. Chưa có tiết kiệm để tính lãi.';render();}

function transfer(){return `${topbar('Chuyển tiền ảo','MONEY LAB · GIAO DỊCH')}<div class="screen"><h2>Chuyển giữa các tài khoản</h2><p class="small muted">Luyện tập chuyển tiền bằng số dư mô phỏng. Không có giao dịch thật.</p><label class="form-label" for="sourceAccount">Từ tài khoản</label><select id="sourceAccount" class="form-select" onchange="moneyState.from=this.value;moneyState.message='';render()">${validAccounts.map(id=>`<option value="${id}" ${id===moneyState.from?'selected':''}>${accountLabels[id]} · ${fmt(accounts[id])}</option>`).join('')}</select><label class="form-label" for="targetAccount">Đến tài khoản</label><select id="targetAccount" class="form-select" onchange="moneyState.to=this.value;moneyState.message='';render()">${validAccounts.map(id=>`<option value="${id}" ${id===moneyState.to?'selected':''}>${accountLabels[id]}</option>`).join('')}</select><label class="form-label" for="transferAmount">Số tiền (VND)</label><input id="transferAmount" class="form-select" type="number" min="1" step="1000" inputmode="numeric" value="${moneyState.amount}" oninput="moneyState.amount=this.value"/><div class="notice">💡 Tiền gửi tiết kiệm và tiền đầu tư có mục đích khác nhau. Hãy thử phân bổ dựa trên nhu cầu thanh khoản của bạn.</div>${button('Xác nhận chuyển tiền ảo','performTransfer()')}<div style="margin-top:10px">${button('← Quay lại Money Lab',"go('labhome')",'secondary')}</div>${moneyState.message?`<div class="notice" role="status">${moneyState.message}</div>`:''}</div>`}

const nav=[['home','⌂','Trang chủ'],['selfie','◎','Selfie'],['learn','◈','Học'],['labhome','⚗','Money Lab'],['finexpert','✦','FinExpert']];

function selfie(){let c=state.selfie;return `${topbar('Chân dung tài chính','FINANCIAL SELFIE')}<div class="screen">${stage(state.selfieStep,3)}${state.selfieStep===0?`<div class="lesson-art" style="height:130px;font-size:62px">📸</div><h2>Hiểu mình trước khi hiểu tiền</h2><p class="muted small">Không có câu trả lời đúng hay sai. Hãy chọn điều gần với bạn nhất.</p><h3>Bạn tự tin thế nào khi quản lý tiền?</h3><div class="pillrow">${[1,2,3,4,5].map(n=>`<button class="pill ${c.confidence===n?'active':''}" onclick="state.selfie.confidence=${n};render()">${n}</button>`).join('')}</div><p class="small muted">1 = Chưa tự tin · 5 = Rất tự tin</p>${button('Tiếp tục →','state.selfieStep=1;render()')}`:state.selfieStep===1?`<h2>Thói quen của bạn</h2><h3>Bạn thường tiết kiệm như thế nào?</h3><div class="pillrow">${['Hiếm khi','Thỉnh thoảng','Thường xuyên'].map(x=>`<button class="pill ${c.save===x?'active':''}" onclick="state.selfie.save='${x}';render()">${x}</button>`).join('')}</div><h3 style="margin-top:28px">Bạn thường chi tiêu theo cách nào?</h3><div class="pillrow">${['Tiết kiệm','Cân bằng','Thoải mái'].map(x=>`<button class="pill ${c.spend===x?'active':''}" onclick="state.selfie.spend='${x}';render()">${x}</button>`).join('')}</div><div style="margin-top:30px">${button('Tiếp tục →','state.selfieStep=2;render()')}</div>`:state.selfieStep===2?`<h2>Mục tiêu gần nhất?</h2><p class="muted small">Bạn muốn ưu tiên điều gì trong 3–6 tháng tới?</p>${['Quỹ khẩn cấp','Mua laptop','Kiểm soát chi tiêu','Bắt đầu đầu tư'].map(x=>`<button class="option ${c.goal===x?'selected':''}" onclick="state.selfie.goal='${x}';render()">${x}</button>`).join('')}${button('Xem Financial Selfie →','state.selfieStep=3;render()')}`:`<div class="result"><div class="emoji">🌿</div><div class="label">FINANCIAL SELFIE CỦA BẠN</div><h2>${c.spend==='Cân bằng'?'Người cân bằng':c.spend==='Tiết kiệm'?'Người ưu tiên tiết kiệm':'Người tận hưởng'}</h2><p class="small">Mức tự tin: ${c.confidence}/5 · Tiết kiệm: ${c.save}</p><p class="small">Mục tiêu của bạn: <b>${c.goal}</b></p></div><div class="notice">Đây là bản tự đánh giá thói quen, không phải chẩn đoán hay xếp hạng sức khỏe tài chính. Hãy kiểm tra thêm kỹ năng qua tình huống thực tế.</div>${button('Bắt đầu bài học được gợi ý →',"state.lessonStep=0;go('lesson')")}`}<div style="margin-top:13px">${state.selfieStep>0?button('← Quay lại','state.selfieStep-=1;render()','secondary'):''}</div></div>`}

function lab(){let spent=state.alloc.reduce((a,b)=>a+b,0),remaining=8000000-spent;return `${topbar('Money Lab','MÔ PHỎNG KHÔNG DÙNG TIỀN THẬT')}<div class="screen"><div class="hero" style="min-height:116px"><div class="label">THỬ THÁCH 01</div><h2 style="font-size:20px">Tháng lương đầu tiên</h2><p>Bạn nhận được 8.000.000 ₫. Phân bổ ngân sách rồi thử xử lý sự cố.</p><div class="illustration" style="font-size:53px">💵</div></div><div class="between card"><div><div class="small muted">Số tiền còn lại</div><h2 style="margin:3px 0;color:${remaining<0?'#b64f20':'#087c48'}">${fmt(remaining)}</h2></div><span class="chip ${remaining<0?'err':'success'}">${remaining<0?'Vượt ngân sách':remaining===0?'Đã phân bổ hết':'Còn dư'}</span></div>${cats.map(([ic,name],i)=>`<div class="slider-row"><div class="between"><b class="small">${ic} ${name}</b><b class="small">${fmt(state.alloc[i])}</b></div><input type="range" min="0" max="8000000" step="200000" value="${state.alloc[i]}" onchange="updateAlloc(${i},this.value)" aria-label="${name}"></div>`).join('')}<div class="scenario"><div class="label" style="color:#a87417">⚡ TÌNH HUỐNG BẤT NGỜ</div><h3 style="margin-top:7px">Laptop hỏng: cần 2.000.000 ₫ để sửa.</h3><p class="small">Bạn sẽ xử lý thế nào?</p>${[['fund','Dùng tiền từ quỹ khẩn cấp'],['cut','Cắt bớt chi tiêu tùy chọn'],['borrow','Vay nhanh để sửa ngay']].map(([k,t])=>`<button class="option ${state.scenario===k?'selected':''}" onclick="state.scenario='${k}';render()">${t}</button>`).join('')}${state.scenario?`<div class="notice">${state.scenario==='fund'?state.alloc[3]>=2000000?'Quỹ khẩn cấp hiện đủ 2 triệu đồng. Bạn có thể sửa laptop mà không phải vay.':'Bạn muốn dùng quỹ khẩn cấp, nhưng số dư dành cho quỹ hiện chưa đủ 2 triệu. Hãy xem lại ngân sách hoặc kết hợp các nguồn.':state.scenario==='cut'?'Cắt chi tiêu tùy chọn có thể hữu ích, nhưng hãy kiểm tra số tiền có thể cắt và thời gian cần sửa laptop.':'Vay tiền có thể làm phát sinh nghĩa vụ trả nợ và chi phí. Trước khi vay, hãy kiểm tra các phương án ít rủi ro hơn.'}</div>`:''}${button('Xem kết quả →',"state.completed=true;state.points=100;go('result')")}</div><div class="note">Tất cả số liệu chỉ phục vụ học tập. Các quyết định phụ thuộc vào hoàn cảnh thực tế của từng người.</div></div>`}

const investLessons=[
 {title:'Đầu tư là gì?',term:'Đầu tư (Investment)',art:'🌱',plain:'Đầu tư là dùng tiền để mua tài sản với kỳ vọng tạo ra giá trị hoặc thu nhập trong tương lai. Kết quả không chắc chắn: bạn có thể lãi hoặc lỗ.',metaphor:'Đầu tư giống như trồng cây. Bạn bỏ vốn và thời gian, hy vọng cây lớn lên. Nhưng sâu bệnh hoặc thời tiết xấu có thể khiến cây không phát triển như mong đợi.',example:'Bạn có 1 triệu đồng và dùng 500.000 ₫ mua cổ phiếu. Nếu giá trị số cổ phiếu tăng thành 600.000 ₫, bạn lãi 100.000 ₫ trước phí và thuế. Nếu giảm còn 400.000 ₫, bạn lỗ 100.000 ₫ nếu bán ở mức đó.',deeperTitle:'Đầu tư trong đời sống và trong tài chính',deeper:'Bạn có thể nói “đầu tư cho việc học” khi mua khóa học để tăng kỹ năng và thu nhập sau này. Đó là đầu tư vào bản thân, nhưng không phải tài sản tài chính có thể bán trên thị trường như cổ phiếu. Cả hai đều cần bỏ nguồn lực hôm nay cho lợi ích tương lai, và cả hai đều không bảo đảm kết quả.',thought:'Mua một chiếc laptop để học lập trình là chi tiêu hay đầu tư vào bản thân? Điều gì quyết định giá trị của lựa chọn đó?',quiz:'Những phát biểu nào đúng về đầu tư?',opts:['Giá trị tài sản có thể tăng hoặc giảm','Mua khóa học có thể được gọi là đầu tư vào bản thân','Đầu tư cổ phiếu bảo đảm sinh lời','Khoản đầu tư có thể tạo thu nhập hoặc tăng giá trị'],answers:[0,1,3],why:'Đầu tư có tiềm năng mang lại lợi ích nhưng không bảo đảm. “Đầu tư vào bản thân” là cách dùng rộng hơn của từ đầu tư, không đồng nghĩa với sở hữu tài sản tài chính.',multi:true},
 {title:'Tiết kiệm có giống đầu tư không?',term:'Tiết kiệm (Saving) và Đầu tư (Investing)',art:'🏦',plain:'Tiết kiệm thường ưu tiên giữ tiền sẵn sàng cho các mục tiêu gần và an toàn tương đối. Đầu tư hướng đến tăng trưởng hoặc thu nhập, nhưng đi kèm những rủi ro khác nhau.',metaphor:'Tiết kiệm giống như bình nước mang theo để dùng khi cần. Đầu tư giống như trồng vườn cây: có thể thu hoạch sau này, nhưng cần thời gian và chịu nhiều yếu tố bất định.',example:'Bạn cần 5 triệu đồng đóng học phí sau 3 tháng. Gửi tiền trong tài khoản phù hợp với thời điểm sử dụng thường hợp lý hơn việc đặt toàn bộ vào cổ phiếu có thể giảm giá đúng lúc cần tiền.',deeperTitle:'Gửi sổ tiết kiệm ngân hàng có phải đầu tư?',deeper:'Trong cách nói hằng ngày, gửi tiết kiệm cũng là cách “đầu tư tiền” để nhận lãi. Nhưng trong quản lý tài chính cá nhân, ta thường tách tiền gửi tiết kiệm và các khoản đầu tư như cổ phiếu, trái phiếu. Tiền gửi có lãi suất theo điều kiện sản phẩm và rủi ro riêng; cổ phiếu không có lợi nhuận cố định. Bảo hiểm tiền gửi có giới hạn và điều kiện áp dụng, không phải mọi khoản gửi đều được bảo đảm vô hạn.',thought:'Nếu bạn dự định mua xe trong 6 tháng, bạn ưu tiên thanh khoản, an toàn hay lợi nhuận cao? Vì sao?',quiz:'Bạn sẽ cân nhắc lựa chọn nào khi cần trả học phí sau 3 tháng?',opts:['Chọn sản phẩm tiết kiệm có kỳ hạn phù hợp','Giữ khoản tiền cần dùng ở nơi có thể rút đúng hạn','Đưa toàn bộ tiền học phí vào một cổ phiếu biến động mạnh','So sánh điều kiện rút trước hạn và các loại phí'],answers:[0,1,3],why:'Khoản tiền cần sử dụng sớm cần được quản lý theo mục tiêu thời gian và khả năng rút. Giá cổ phiếu có thể giảm khi đến hạn học phí.',multi:true},
 {title:'Cổ phiếu là gì?',term:'Cổ phiếu (Stock / Share)',art:'🍰',plain:'Cổ phiếu đại diện cho một phần quyền sở hữu công ty. Người mua cổ phiếu trở thành cổ đông, nhưng không được bảo đảm có cổ tức hoặc giá tăng.',metaphor:'Hãy hình dung một chiếc bánh được chia thành nhiều miếng. Mỗi cổ phiếu giống như một phần rất nhỏ của chiếc bánh doanh nghiệp.',example:'Bạn mua 10 cổ phiếu với giá 50.000 ₫/cổ phiếu, tổng cộng 500.000 ₫ trong môi trường học tập. Nếu giá giảm còn 40.000 ₫, danh mục còn 400.000 ₫ trước phí và thuế. Bạn chưa mất tiền mặt cho đến khi bán, nhưng giá trị tài sản đã giảm.',deeperTitle:'Giá cổ phiếu tăng có nghĩa doanh nghiệp luôn tốt?',deeper:'Không hẳn. Giá thị trường còn phụ thuộc kỳ vọng, tâm lý, tin tức và điều kiện kinh tế. Một doanh nghiệp tốt vẫn có thể bị định giá quá cao. Warren Buffett thường nhấn mạnh việc tìm hiểu giá trị doanh nghiệp thay vì chỉ nhìn biến động giá ngắn hạn.',thought:'Nếu một cổ phiếu giảm 20% trong tuần, bạn cần tìm hiểu điều gì trước khi quyết định mua hoặc bán?',quiz:'Khi sở hữu cổ phiếu, điều nào có thể xảy ra?',opts:['Bạn sở hữu một phần nhỏ doanh nghiệp','Giá cổ phiếu giảm dù doanh nghiệp vẫn có lãi','Bạn chắc chắn nhận cổ tức hằng năm','Giá cổ phiếu có thể biến động vì kỳ vọng thị trường'],answers:[0,1,3],why:'Cổ phiếu là quyền sở hữu, giá có thể tăng hoặc giảm và cổ tức phụ thuộc quyết định phân phối lợi nhuận, không được bảo đảm.',multi:true},
 {title:'Trái phiếu là gì?',term:'Trái phiếu (Bond)',art:'📜',plain:'Trái phiếu là công cụ nợ. Khi mua trái phiếu, bạn cho tổ chức phát hành vay tiền theo các điều khoản về lãi và thời hạn hoàn trả.',metaphor:'Cổ phiếu giống mua một miếng bánh doanh nghiệp. Trái phiếu giống như có một giấy hẹn trả nợ từ bên vay.',example:'Ví dụ một trái phiếu mệnh giá 1 triệu đồng, lãi danh nghĩa 6%/năm và trả lãi hằng năm trong bài học này. Tiền lãi theo hợp đồng là 60.000 ₫/năm nếu bên phát hành thực hiện nghĩa vụ; giá bán lại trái phiếu có thể thay đổi.',deeperTitle:'Trái phiếu có luôn an toàn hơn cổ phiếu?',deeper:'Không thể kết luận cho mọi trái phiếu. Rủi ro phụ thuộc đơn vị phát hành, điều khoản, thời hạn, khả năng thanh khoản và biến động lãi suất. Trái phiếu doanh nghiệp có thể mất tiền nếu doanh nghiệp không trả được nợ.',thought:'Nếu một trái phiếu quảng cáo lãi suất cao bất thường, bạn nên hỏi những câu gì về khả năng trả nợ?',quiz:'Điểm nào đúng về trái phiếu?',opts:['Bên phát hành có nghĩa vụ trả theo điều khoản phát hành','Người mua trái phiếu tự động thành cổ đông','Bên phát hành có thể chậm trả hoặc không trả được nợ','Giá trái phiếu có thể biến động nếu bán trước hạn'],answers:[0,2,3],why:'Trái phiếu là khoản nợ theo hợp đồng, không phải quyền sở hữu. Rủi ro tín dụng và giá thị trường vẫn tồn tại.',multi:true},
 {title:'Rủi ro và lợi nhuận',term:'Rủi ro (Risk) và Lợi nhuận (Return)',art:'⚖️',plain:'Lợi nhuận là khoản bạn nhận được hoặc mất đi so với vốn. Rủi ro là sự không chắc chắn của kết quả, bao gồm nguy cơ mất tiền.',metaphor:'Đi trên con đường dốc có thể đưa bạn đến điểm nhìn đẹp, nhưng đường trơn và thời tiết làm kết quả khó đoán hơn.',example:'Bạn đầu tư 5 triệu đồng, tài sản giảm 20% còn 4 triệu đồng. Để trở lại 5 triệu đồng, khoản còn lại phải tăng 25%, không phải 20%.',deeperTitle:'Lợi nhuận cao có luôn là lựa chọn tốt?',deeper:'Không. Bạn cần xem mình có chịu nổi khoản lỗ hay không, khi nào cần tiền, và liệu bạn hiểu sản phẩm. Mức lợi nhuận được quảng cáo cao thường cần được kiểm tra cùng mức rủi ro và các điều kiện đi kèm.',thought:'Một khoản đầu tư có thể tăng 30% hoặc giảm 40%. Bạn có dùng tiền thuê nhà tháng tới để tham gia không?',quiz:'Một khoản từ 100 giảm còn 80. Cần tăng bao nhiêu phần trăm từ 80 để trở lại 100?',opts:['20%','25%','30%','40%'],answers:[1],why:'Mức tăng cần có là 20 chia cho 80, bằng 25%. Khi mất vốn, tỷ lệ tăng để hồi phục có thể lớn hơn tỷ lệ giảm ban đầu.',multi:false},
 {title:'Đa dạng hóa danh mục',term:'Đa dạng hóa (Diversification)',art:'🧺',plain:'Đa dạng hóa là phân chia tiền giữa nhiều tài sản hoặc nhóm tài sản để giảm việc quá phụ thuộc vào một khoản đầu tư.',metaphor:'Đừng để toàn bộ trứng vào một giỏ. Nếu một giỏ rơi, bạn có thể còn trứng ở những giỏ khác.',example:'Bạn có 10 triệu đồng. Thay vì mua một cổ phiếu duy nhất, bạn thử phân bổ vào cổ phiếu, trái phiếu và một phần tiền mặt. Khi thị trường thay đổi, mỗi nhóm có thể phản ứng khác nhau.',deeperTitle:'Mua nhiều cổ phiếu là đã đa dạng hóa tốt?',deeper:'Chưa chắc. Mua 10 cổ phiếu cùng ngành vẫn khiến bạn phụ thuộc nhiều vào một rủi ro chung. Đa dạng hóa còn liên quan đến ngành, loại tài sản, mức tương quan và thời gian nắm giữ. Nhiều tài sản vẫn có thể cùng giảm giá.',thought:'Nếu bạn chỉ mua cổ phiếu của ba ngân hàng khác nhau, danh mục đã thực sự đa dạng chưa?',quiz:'Những cách nào có thể giúp giảm rủi ro tập trung?',opts:['Phân bổ giữa các nhóm tài sản phù hợp','Xem xét mức độ phụ thuộc vào cùng một ngành','Cho toàn bộ tiền vào cổ phiếu vừa tăng giá mạnh','Giữ tiền cần dùng sớm ở tài sản có tính thanh khoản phù hợp'],answers:[0,1,3],why:'Đa dạng hóa giúp giảm rủi ro tập trung nhưng không loại bỏ rủi ro chung của thị trường. Cần xét mục tiêu, khả năng chịu lỗ và thời điểm cần tiền.',multi:true}
];

function continueTrack(t){flow.track=t;flow.slide=0;flow.picks=[];flow.checked=false;flow.match={};flow.matchPending=-1;flow.msg='';go('invest')}
function markTrackFinished(){state.trackDone[flow.track]=true;state.lastCompletedTrack=flow.track;state.investDone=state.trackDone.every(Boolean);go('journey')}
function canAdvanceFlow(){const s=flowSlide();if(s.options||s.kind==='match')return flow.checked;return true}
function checkAndAdvance(){if(!canAdvanceFlow()){flow.msg='Hãy chọn và kiểm tra đáp án trước khi tiếp tục.';render();const msg=document.getElementById('flow-feedback');if(msg)msg.scrollIntoView({behavior:'smooth',block:'center'});return}nextInvest()}
function startTrack(t=0){flow.track=t;flow.slide=0;flow.picks=[];flow.checked=false;flow.match={};flow.matchPending=-1;flow.msg='';go('invest')}
function flowSlide(){return learningTracks[flow.track].slides[flow.slide]}
function nextInvest(){const steps=learningTracks[flow.track].slides.length;if(flow.slide<steps-1){flow.slide++}else{markTrackFinished();return}flow.picks=[];flow.checked=false;flow.match={};flow.matchPending=-1;flow.msg='';render();window.scrollTo(0,0)}
function backInvest(){if(flow.slide>0)flow.slide--;else{goJourney();return}flow.picks=[];flow.checked=false;flow.match={};flow.matchPending=-1;flow.msg='';render();window.scrollTo(0,0)}
function chooseFlow(i){if(flow.checked)return;const s=flowSlide();if(s.kind==='multi'||s.kind==='scenario'){flow.picks=flow.picks.includes(i)?flow.picks.filter(x=>x!==i):[...flow.picks,i]}else flow.picks=[i];render()}
function checkFlow(){if(!flow.picks.length){flow.msg='Hãy chọn ít nhất một đáp án.';render();return}flow.checked=true;flow.msg='';render()}
function matchSelect(i){flow.matchPending=i;render()}
function matchTarget(j){if(flow.matchPending<0)return;flow.match[flow.matchPending]=j;flow.matchPending=-1;render()}
function matchDrop(e,j){e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0)flow.match[i]=j;flow.matchPending=-1;render()}
function matchDrag(e,i){e.dataTransfer.setData('text/plain',String(i))}
function checkMatch(){flow.checked=true;flow.msg='';render()}
function embeddedTransfer(){const raw=String(flow.savingAmount).trim(),amt=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(amt)||amt<=0){flow.msg='Nhập số tiền hợp lệ.';render();return}flow.msg=transferFunds('everyday','savings',amt)||`Đã chuyển ${fmt(amt)} vào tiết kiệm (tiền ảo).`;render()}

function moneyChoose(where){if(!['savings','investment'].includes(where))return;flow.moneyChoice=where;flow.moneyRevealed=false;flow.moneyOutcomesSeen=[];render();}
function moneyReveal(){if(!flow.moneyChoice)return;flow.moneyScenario=flow.moneyChoice==='investment'?moneyOutcome():'savings';if(flow.moneyChoice==='investment'&&!flow.moneyOutcomesSeen.includes(flow.moneyScenario))flow.moneyOutcomesSeen.push(flow.moneyScenario);flow.moneyRevealed=true;render();}
function moneyTryOpposite(){if(flow.moneyChoice!=='investment')return;flow.moneyScenario=flow.moneyOutcomesSeen[0]==='up'?'down':'up';if(!flow.moneyOutcomesSeen.includes(flow.moneyScenario))flow.moneyOutcomesSeen.push(flow.moneyScenario);flow.moneyRevealed=true;render();}
function moneyReset(){flow.moneyChoice=null;flow.moneyRevealed=false;flow.moneyOutcomesSeen=[];render();}
let movingBag=null;
function bagPointerStart(event){if(event.button!==undefined&&event.button!==0)return;event.preventDefault();const el=event.currentTarget;const r=el.getBoundingClientRect();const ghost=el.cloneNode(true);ghost.removeAttribute('id');ghost.className='bag-ghost';ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);movingBag={ghost,id:event.pointerId,dx:event.clientX-r.left,dy:event.clientY-r.top};bagPointerMove(event);}
function bagPointerMove(event){if(!movingBag||movingBag.id!==event.pointerId)return;movingBag.ghost.style.left=(event.clientX-movingBag.dx)+'px';movingBag.ghost.style.top=(event.clientY-movingBag.dy)+'px';document.querySelectorAll('.drop-basket').forEach(el=>{const box=el.getBoundingClientRect();el.classList.toggle('hovering',event.clientX>=box.left&&event.clientX<=box.right&&event.clientY>=box.top&&event.clientY<=box.bottom)});}
function bagPointerEnd(event){if(!movingBag||movingBag.id!==event.pointerId)return;const hit=document.elementFromPoint(event.clientX,event.clientY)?.closest('.drop-basket');movingBag.ghost.remove();movingBag=null;document.querySelectorAll('.drop-basket').forEach(el=>el.classList.remove('hovering'));if(hit)moneyChoose(hit.dataset.choice);}
document.addEventListener('pointermove',bagPointerMove);
document.addEventListener('pointerup',bagPointerEnd);
document.addEventListener('pointercancel',()=>{if(movingBag){movingBag.ghost.remove();movingBag=null;}document.querySelectorAll('.drop-basket').forEach(el=>el.classList.remove('hovering'));});
function moneyFlowUI(s){
const where=flow.moneyChoice,revealed=flow.moneyRevealed,up=flow.moneyScenario==='up',invest=where==='investment';
const value=invest?(up?s.upValue:s.downValue):s.invest,change=value-s.invest;
const status=invest?(up?'Giá tăng':'Giá giảm'):'Tiền được giữ lại';
return `<section class="money-story"><div class="money-story-intro"><div class="money-story-caption">BẠN CÓ 1.000.000 ₫</div><p>Bạn giữ lại <strong>500.000 ₫</strong> để chi tiêu. Với <strong>500.000 ₫</strong> còn lại, bạn muốn thử cách nào?</p></div>
${!where?`<div class="bag-stage"><div class="drag-bag" id="moneyBag" role="button" tabindex="0" aria-label="Túi tiền 500.000 đồng; kéo hoặc chọn giỏ bên dưới" onpointerdown="bagPointerStart(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('moneyBagHint').focus()}">${moneyBagSVG}</div><div class="bag-instruction" id="moneyBagHint" tabindex="-1">Kéo túi tiền vào một giỏ hoặc chạm để chọn</div></div>`:''}
<div class="basket-row"><button type="button" data-choice="savings" class="drop-basket ${where==='savings'?'chosen':''}" onclick="moneyChoose('savings')"><span class="basket-img">${safeSVG}</span><strong>Tiết kiệm</strong><span class="english">Saving</span><small>Giữ tiền để dùng khi cần</small>${where==='savings'?'<span class="tick-basket">✓</span>':''}</button><button type="button" data-choice="investment" class="drop-basket ${invest?'chosen':''}" onclick="moneyChoose('investment')"><span class="basket-img">${basketSVG}</span><strong>Đầu tư</strong><span class="english">Investing</span><small>Có thể tăng hoặc giảm</small>${invest?'<span class="tick-basket">✓</span>':''}</button></div>
${where?`<div class="choice-line"><span>Đã chọn: <strong>${invest?'Đầu tư':'Tiết kiệm'}</strong></span><button type="button" class="choice-link" onclick="moneyReset()">Đổi giỏ</button></div><div class="mystery-panel" aria-live="polite"><div class="mystery-header">${invest?'KẾT QUẢ THỊ TRƯỜNG':'ĐIỀU GÌ XẢY RA VỚI TIỀN?'}</div>${!revealed?`<div class="mystery-card"><div class="card-stack" aria-hidden="true"><div class="back-card"></div><div class="front-card">?</div></div><strong>${invest?'Giá sẽ tăng hay giảm?':'Tiền tiết kiệm sẽ thế nào?'}</strong><p>Chạm để mở thẻ và xem kết quả.</p><button type="button" class="reveal-btn" onclick="moneyReveal()">Mở kết quả <span>›</span></button></div>`:`<div class="revealed-card ${invest&&!up?'negative':'positive'}"><div class="reveal-kicker">${invest?(up?'↗':'↘'):'▣'} ${status}</div><div class="money-result"><div class="result-col"><span class="result-coin">${safeSVG}</span><b>500.000 ₫</b><small>Ban đầu</small></div><span class="result-arrow">→</span><div class="result-col result-end"><span class="result-coin ${invest&&!up?'smaller':'larger'}">${invest?basketSVG:safeSVG}</span><b>${fmt(value)}</b><small>Sau tình huống</small></div></div><div class="result-pill">${invest?up?'Lãi +100.000 ₫':'Giảm giá trị −100.000 ₫':'Vẫn là 500.000 ₫'}</div><p class="outcome-note">${invest?'Nếu bán ở mức giá này, bạn '+(up?'lãi':'lỗ')+' '+fmt(Math.abs(change))+' trước phí và thuế.':'Trong ví dụ ngắn này, số tiền không biến động theo giá thị trường. Tiền gửi có thể có lãi và vẫn có các điều kiện, rủi ro riêng.'}</p></div><div class="money-compare"><span class="compare-icon">${invest?safeSVG:basketSVG}</span><span>${invest?'Nếu chọn tiết kiệm: số tiền thường ít biến động hơn, phù hợp hơn với khoản cần dùng sớm.':'Nếu chọn đầu tư: giá trị có thể tăng lên hoặc giảm xuống, kể cả khi bạn chưa bán.'}</span></div><div class="story-actions">${invest&&flow.moneyOutcomesSeen.length===1?`<button type="button" class="story-alt" onclick="moneyTryOpposite()">↻ Thử tình huống còn lại</button>`:''}<button type="button" class="story-alt" onclick="moneyReset()">Thử giỏ khác</button></div>`}</div>`:''}
<p class="story-disclaimer">Mô phỏng để học tập. Tiền ảo, tình huống minh hoạ, không phải giá thị trường thực.</p></section>`;
}

function flowContent(s){let h='';
 if(s.lead)h+=`<div class="card"><p style="margin:0">${s.lead}</p></div>`;
 if(s.body)h+=`<div class="card"><p style="margin:0">${s.body}</p></div>`;
 if(s.metaphor)h+=`<div class="notice"><b>🌿 Hình dung:</b> ${s.metaphor}</div>`;
 if(s.example)h+=`<div class="card"><div class="label">Ví dụ</div><p style="margin-bottom:0">${s.example}</p></div>`;
 if(s.tip)h+=`<div class="tip"><b>💡 Ghi nhớ:</b> ${s.tip}</div>`;
 if(s.kind==='money-flow')h+=moneyFlowUI(s);
 if(s.options){const multi=['multi','scenario'].includes(s.kind);h+=`<p class="small muted">${multi?'Chọn tất cả phương án phù hợp. Có thể có nhiều đáp án.':'Chọn một phương án.'}</p>`+s.options.map((o,i)=>{const good=flow.checked&&s.answers.includes(i),wrong=flow.checked&&flow.picks.includes(i)&&!s.answers.includes(i);return `<button class="option ${flow.picks.includes(i)?'selected':''} ${good?'flow-option-correct':''} ${wrong?'flow-option-wrong':''}" onclick="chooseFlow(${i})" aria-pressed="${flow.picks.includes(i)}" ${flow.checked?'disabled':''}>${multi?(flow.picks.includes(i)?'☑':'☐'):(flow.picks.includes(i)?'◉':'○')} ${o}${good?'  ✓':''}${wrong?'  ✕':''}</button>`}).join('');if(flow.checked){const exact=flow.picks.length===s.answers.length&&s.answers.every(i=>flow.picks.includes(i));h+=`<div id="flow-feedback" class="flow-feedback ${exact?'':'wrong'}" role="status"><strong>${exact?'✓ Chính xác!':'✕ Chưa chính xác. Đây là đáp án và giải thích:'}</strong><p>${s.why}</p><b>${multi?'Các phương án phù hợp:':'Đáp án phù hợp:'}</b><ul>${s.answers.map(i=>`<li>${s.options[i]}</li>`).join('')}</ul><p class="small muted">${exact?'Bạn đã hiểu điểm chính.':'So sánh các đáp án với lựa chọn của bạn, sau đó bấm Tiếp theo.'}</p></div>`}}
 if(s.kind==='match'){const p=s.pairs;h+=`<p class="small muted">Kéo thẻ ở cột trái sang ô bên phải, hoặc chạm thẻ rồi chạm ô tương ứng.</p><div class="matchgrid"><div>${p.map(([a],i)=>`<button class="matchitem ${flow.matchPending===i?'pending':''}" draggable="true" ondragstart="matchDrag(event,${i})" onclick="matchSelect(${i})">${a}</button>`).join('')}</div><div>${p.map(([,b],j)=>`<button class="matchitem dropzone ${Object.values(flow.match).includes(j)?'filled':''}" ondragover="event.preventDefault()" ondrop="matchDrop(event,${j})" onclick="matchTarget(${j})">${b}${Object.values(flow.match).includes(j)?' ✓':''}</button>`).join('')}</div></div>`;if(!flow.checked){h+=`<div class="note">Ghép tất cả cặp, sau đó dùng nút Kiểm tra ghép nối bên dưới.</div>`}else{const correct=p.every((_,i)=>flow.match[i]===i);h+=`<div id="flow-feedback" class="flow-feedback ${correct?'':'wrong'}" role="status"><b>${correct?'Bạn ghép đúng tất cả.':'Một vài cặp chưa khớp.'}</b><p>${s.why}</p><p>${p.map(x=>x.join(' → ')).join(' · ')}</p></div>`}}
 if(s.kind==='lab-savings')h+=`<div class="account-mini"><div class="small">Tài khoản thanh toán</div><h3>${fmt(accounts.everyday)}</h3><div class="small">Tài khoản tiết kiệm</div><h3>${fmt(accounts.savings)}</h3><label for="flowSaving">Số tiền chuyển (VND)</label><input id="flowSaving" type="number" min="1" step="100000" value="${esc(flow.savingAmount)}" oninput="flow.savingAmount=this.value" />${button('Chuyển sang tiết kiệm','embeddedTransfer()','secondary')}${flow.msg?`<div class="notice" role="status">${esc(flow.msg)}</div>`:''}</div><p class="note">Đây là chuyển tiền ảo giữa hai tài khoản trong Money Lab. Không thực hiện giao dịch thật.</p>`;
 if(s.kind==='lab-budget'){const saving=100-flow.needs-flow.wants;h+=`<div class="account-mini"><div class="between"><b>Thiết yếu</b><b>${flow.needs}% · ${fmt(flow.needs*80000)}</b></div><input aria-label="Chi thiết yếu" type="range" min="20" max="90" step="5" value="${flow.needs}" oninput="flow.needs=+this.value;if(flow.needs+flow.wants>100)flow.wants=100-flow.needs;render()"><div class="between"><b>Mong muốn</b><b>${flow.wants}% · ${fmt(flow.wants*80000)}</b></div><input aria-label="Chi mong muốn" type="range" min="0" max="${100-flow.needs}" step="5" value="${flow.wants}" oninput="flow.wants=+this.value;render()"><div class="notice"><b>Tiết kiệm / trả thêm nợ: ${saving}% · ${fmt(saving*80000)}</b><p>${saving>=20?'Bạn đã dành ít nhất 20% cho mục tiêu tài chính.':'Mức dành cho mục tiêu tài chính thấp hơn 20%. Có thể cần xem lại chi phí hoặc áp dụng tỷ lệ thực tế hơn.'}</p></div></div><p class="note">Đây là công cụ lập kế hoạch, không tự trừ tiền trong các tài khoản.</p>`}
 if(s.kind==='calculator'){const loss=flow.loss,principal=Number(flow.principal)||0,remaining=principal*(1-loss/100),rebound=loss===100?null:loss/(100-loss)*100;h+=`<div class="account-mini"><label>Vốn ban đầu (VND)</label><input type="number" min="1000" step="100000" value="${flow.principal}" oninput="flow.principal=this.value;render()"><div class="between"><b>Giảm giá</b><b>${loss}%</b></div><input type="range" min="5" max="90" step="5" value="${loss}" oninput="flow.loss=+this.value;flow.guess='';render()"><div class="viz-compare"><div class="viz-stat"><div class="small muted">Ban đầu</div><b>${fmt(principal)}</b><div class="vizbar"><div class="grow" style="width:100%"></div></div></div><div class="viz-stat"><div class="small muted">Sau khi giảm</div><b>${fmt(remaining)}</b><div class="vizbar"><div class="drop" style="width:${principal?Math.max(5,remaining/principal*100):0}%"></div></div></div><div class="viz-stat"><div class="small muted">Mức cần tăng để hồi vốn</div><b>${rebound?rebound.toLocaleString('vi-VN',{maximumFractionDigits:2}):'—'}%</b><div class="small muted">Để quay lại ${fmt(principal)}</div></div></div><div class="metrics"><div class="metric"><div class="note">Số tiền giảm</div><b>${fmt(principal-remaining)}</b></div><div class="metric"><div class="note">Phần trăm cần tăng lại</div><b>${rebound?rebound.toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'—'}</b></div></div><p><b>Dự đoán của bạn:</b> cần tăng bao nhiêu % để hồi vốn?</p><input type="number" min="0" step="1" placeholder="Nhập số %" value="${esc(flow.guess)}" oninput="flow.guess=this.value"><div style="margin-top:10px">${button('Xem kết quả',"flow.msg='recovery';render()",'secondary')}</div>${flow.msg==='recovery'?`<div class="notice" role="status"><b>Đáp án: ${rebound.toLocaleString('vi-VN',{maximumFractionDigits:2})}%</b><p>Khoản giảm là ${fmt(principal-remaining)}. Nhưng để quay lại ${fmt(principal)}, bạn phải kiếm lại khoản đó từ mức còn lại là ${fmt(remaining)}. Vì vậy ta lấy ${fmt(principal-remaining)} ÷ ${fmt(remaining)}. ${flow.guess!==''?Math.abs(Number(flow.guess)-rebound)<.51?'Dự đoán của bạn rất gần.':'So sánh dự đoán với kết quả để thấy vì sao phần trăm hồi vốn lớn hơn phần trăm đã giảm.':''}</p></div>`:''}</div><p class="note">Tính toán từ mức giá trị còn lại, bỏ qua phí, thuế và cổ tức.</p>`}
 if(s.kind==='lab-portfolio'){const base=accounts.investment, cash=100-state.stockPct-state.bondPct,sc=investmentScenarios[state.investScenario];const pct=(state.stockPct*sc.stock+state.bondPct*sc.bond)/100;h+=`<div class="account-mini"><p class="small">Vốn ảo trong tài khoản đầu tư: <b>${fmt(base)}</b></p>${base===0?`<div class="notice">Chưa có vốn trong tài khoản đầu tư. Bạn vẫn có thể dùng thanh phân bổ để thử các tỷ lệ; chuyển vốn từ Money Lab khi muốn.</div>`:''}<div class="between"><b>Cổ phiếu (Stock)</b><b>${state.stockPct}%</b></div><input type="range" min="0" max="100" step="5" value="${state.stockPct}" oninput="setPortfolio('stock',this.value)"><div class="between"><b>Trái phiếu (Bond)</b><b>${state.bondPct}%</b></div><input type="range" min="0" max="100" step="5" value="${state.bondPct}" oninput="setPortfolio('bond',this.value)"><div class="small muted">Tiền mặt: ${cash}%</div><div class="pillrow" style="margin-top:12px">${Object.entries(investmentScenarios).map(([k,v])=>`<button class="pill ${state.investScenario===k?'active':''}" onclick="state.investScenario='${k}';render()">${v.name}</button>`).join('')}</div><div class="notice"><b>Biến động danh mục: ${pct.toLocaleString('vi-VN',{maximumFractionDigits:2})}%</b><p>${base>0?'Giá trị dự kiến theo kịch bản: '+fmt(base*(1+pct/100)):'Thử chuyển một khoản tiền ảo vào tài khoản đầu tư để thấy tác động bằng VND.'}</p></div>${button('Mở tài khoản đầu tư',"go('portfolio')",'secondary')}</div><p class="note">Tỷ lệ biến động do tình huống bài học đặt ra, không phải dữ liệu thị trường thực.</p>`}
 if(s.points)h+=`<div class="card"><b>4 điều cần nhớ</b><ul class="summarylist">${s.points.map(v=>`<li>${v}</li>`).join('')}</ul></div>`;
 if(s.hook)h+=`<div class="notice"><b>🔎 Bài tiếp theo:</b> ${s.hook}</div>`;
 return h;
}
function invest(){const track=learningTracks[flow.track],s=flowSlide();const total=track.slides.length;return `${topbar(track.name,'FINSMART · MONEY BITES + MONEY LAB')}<div class="screen">${stage(flow.slide,total-1)}<div class="between"><span class="label">BÀI ${flow.track+1}/${learningTracks.length}</span><span class="chip">${flow.slide+1}/${total} màn hình</span></div>${s.kind==='money-flow'?'':`<div class="lesson-art" style="height:128px;font-size:66px">${s.icon}</div>`}<h2>${s.title}</h2>${flowContent(s)}${(s.options||s.kind==='match')&&!flow.checked?`<button class="primary" onclick="${s.kind==='match'?'checkMatch()':'checkFlow()'}" ${s.kind==='match'?'':flow.picks.length===0?'disabled':''}>${s.kind==='match'?'Kiểm tra ghép nối':'Kiểm tra đáp án'}</button>`:button(flow.slide===total-1?'Hoàn thành và xem hành trình':'Tiếp theo','checkAndAdvance()')}<div style="margin-top:10px">${button('← Quay lại','backInvest()','secondary')}</div><p class="note">Hoạt động học tập sử dụng ví dụ và tiền mô phỏng. Không phải lời khuyên đầu tư cá nhân.</p></div>`}
function setPortfolio(kind,v){const n=Number(v);if(kind==='stock'){state.stockPct=n;if(n+state.bondPct>100)state.bondPct=100-n}else{state.bondPct=n;if(n+state.stockPct>100)state.stockPct=100-n}render()}
const investmentScenarios={drop:{name:'Thị trường giảm mạnh',stock:-20,bond:-3,cash:0},rise:{name:'Thị trường tăng',stock:15,bond:2,cash:0},mixed:{name:'Diễn biến trái chiều',stock:-8,bond:4,cash:0}};
function portfolio(){const principal=accounts.investment,cash=100-state.stockPct-state.bondPct,sc=investmentScenarios[state.investScenario];const change=(state.stockPct*sc.stock+state.bondPct*sc.bond+cash*sc.cash)/10000,future=Math.round(principal*(1+change));return `${topbar('Danh mục đầu tư ảo','MONEY LAB · TÀI KHOẢN ĐẦU TƯ')}<div class="screen"><div class="account-banner"><div class="small">Số dư tài khoản đầu tư</div><h2 style="color:white;font-size:29px">${fmt(principal)}</h2><div class="small">Dùng số tiền đã chuyển từ tài khoản thanh toán hoặc tiết kiệm</div></div>${principal===0?`<div class="scenario"><b>Chưa có vốn đầu tư ảo</b><p class="small">Hãy chuyển một phần tiền từ tài khoản thanh toán sang tài khoản đầu tư để thử phân bổ danh mục.</p>${button('Nạp vốn bằng chuyển khoản ảo',"moneyState.from='everyday';moneyState.to='investment';moneyState.message='';go('transfer')")}</div>`:`<div class="notice">🧺 <b>Đa dạng hóa:</b> Hãy thử phân chia tiền vào cổ phiếu, trái phiếu và tiền mặt trong danh mục.</div>${[['Cổ phiếu',state.stockPct,'stock'],['Trái phiếu',state.bondPct,'bond']].map(([name,val,key])=>`<div class="slider-row"><div class="between"><b>${name}</b><b>${val}% · ${fmt(principal*val/100)}</b></div><input aria-label="Tỷ trọng ${name}" type="range" min="0" max="100" step="5" value="${val}" onchange="setPortfolio('${key}',this.value)"></div>`).join('')}<div class="slider-row"><div class="between"><b>Tiền mặt trong danh mục</b><b>${cash}% · ${fmt(principal*cash/100)}</b></div></div><div style="display:flex;height:16px;gap:2px;border-radius:15px;overflow:hidden;margin:17px 0"><div style="background:#078a50;width:${state.stockPct}%"></div><div style="background:#ecb743;width:${state.bondPct}%"></div><div style="background:#9eb7a9;width:${cash}%"></div></div><div class="sectionhead">Nếu thị trường thay đổi...</div><div class="pillrow">${Object.entries(investmentScenarios).map(([key,ob])=>`<button class="pill ${state.investScenario===key?'active':''}" onclick="state.investScenario='${key}';render()">${ob.name}</button>`).join('')}</div><div class="card"><div class="small muted">Giá trị danh mục theo kịch bản</div><h2 style="color:${future<principal?'#a64a23':'#078449'};margin:8px 0">${fmt(future)}</h2><b style="color:${future<principal?'#a64a23':'#078449'}">${future>=principal?'+':''}${fmt(future-principal)}</b><p class="small muted">Giả định: cổ phiếu ${sc.stock>0?'+':''}${sc.stock}%, trái phiếu ${sc.bond>0?'+':''}${sc.bond}%, tiền mặt ${sc.cash}%.</p></div><div class="notice">${state.stockPct>=80?'⚠️ Danh mục tập trung nhiều vào cổ phiếu nên nhạy cảm với biến động thị trường.':cash>=70?'💧 Giữ nhiều tiền mặt có thể giảm biến động ngắn hạn, nhưng lạm phát có thể làm giảm sức mua.':'🔎 Hãy thử nhiều kịch bản để hiểu sự đánh đổi giữa rủi ro và lợi nhuận.'}</div><p class="note">Đây là dự báo giả định để học, không thay đổi số dư thật hay số dư tài khoản ảo. Không tính phí, thuế hoặc rủi ro vỡ nợ.</p>${button('Hoàn thành bài thực hành →',"state.investDone=true;go('investSummary')")}`}<div style="margin-top:10px">${button('⇄ Chuyển thêm vốn ảo',"moneyState.from='everyday';moneyState.to='investment';moneyState.message='';go('transfer')",'secondary')}</div><div style="margin-top:10px">${button('← Quay lại tài khoản',"moneyState.account='investment';go('account')",'secondary')}</div></div>`}

const POINTS_PER_LESSON=100;
const INVEST_REWARD_POINTS=200;
function investPoints(){return state.trackDone.filter(Boolean).length*POINTS_PER_LESSON}
function goJourney(){state.lastCompletedTrack=null;go('journey')}
function journey(){
 const done=state.trackDone.filter(Boolean).length,points=investPoints(),toReward=Math.max(0,INVEST_REWARD_POINTS-points);
 const just=state.lastCompletedTrack;
 const cards=learningTracks.map((t,i)=>{
  const finished=!!state.trackDone[i];
  const desc=i===0?'Hiểu đầu tư, tiết kiệm và chọn công cụ theo mục tiêu':'Hiểu cổ phiếu, rủi ro, lỗ 20% và mức hồi vốn 25%';
  const action=finished?`<button class="journey-action secondary" onclick="continueTrack(${i})">Ôn lại bài học</button>`:`<button class="journey-action" onclick="continueTrack(${i})">${i===0?'Bắt đầu học':'Học bài này'}</button>`;
  return `<div class="journey-lesson ${finished?'done':''}"><div class="journey-check ${finished?'checked':''}">${finished?'✓':String(i+1)}</div><div class="journey-info"><div class="between"><strong>Bài ${i+1}: ${t.name}</strong><span class="chip">${finished?'✓ Hoàn thành':'Chưa học'}</span></div><p class="small muted" style="margin:7px 0">${desc}</p><div class="small muted">14 màn hình · ${finished?'100 điểm đã nhận':'100 điểm khi hoàn thành'}</div><div style="margin-top:10px">${action}</div></div></div>`;
 }).join('');
 return `${topbar('Hành trình: Đầu tư','FINSMART · TIẾN ĐỘ CHỦ ĐỀ')}<div class="screen">
 ${just!==null?`<div class="lesson-complete journey-celebrate"><div style="font-size:45px">✅</div><h2>Hoàn thành bài ${just+1}!</h2><p>+${POINTS_PER_LESSON} điểm học tập. Bạn đã tích lũy một kỹ năng mới.</p></div>`:''}
 <div class="journey-overview"><div class="between"><div><div class="small">CHỦ ĐỀ ĐẦU TƯ</div><h2 style="margin:7px 0 5px">${done}/${learningTracks.length} bài học hoàn thành</h2></div><div class="journey-medal">${done===2?'🏆':'🌱'}</div></div><div class="journey-segments">${learningTracks.map((_,i)=>`<span class="${state.trackDone[i]?'done':''}"></span>`).join('')}</div><p class="small" style="margin:8px 0 0">${done===2?'Bạn đã hoàn thành các bài mẫu trong chủ đề.':'Còn '+(learningTracks.length-done)+' bài để hoàn thành chủ đề này.'}</p></div>
 <div class="journey-reward"><div class="between"><strong>🎁 Phần thưởng FinExpert</strong><span class="chip">Bản mẫu</span></div><div class="journey-points"><strong>${points} / ${INVEST_REWARD_POINTS}</strong><span>điểm</span></div><div class="progress"><div style="width:${Math.min(100,points/INVEST_REWARD_POINTS*100)}%"></div></div><p class="small" style="margin:9px 0">${toReward>0?`Cần thêm <b>${toReward} điểm</b> (hoàn thành ${Math.ceil(toReward/POINTS_PER_LESSON)} bài) để mở ưu đãi 30% cho khóa học đầu tư mẫu.`:'✓ Đã đạt mốc 200 điểm! Bạn có thể xem ưu đãi FinExpert mẫu.'}</p>${toReward===0?button('Xem phần thưởng FinExpert',"go('finexpert')",'secondary'):''}</div>
 <div class="sectionhead">Các bài học trong chủ đề</div>${cards}
 <p class="note">Chỉ nhận điểm một lần cho mỗi bài, ôn tập không cộng điểm lần nữa. Điểm và ưu đãi ở đây dùng để thử nghiệm sản phẩm.</p>
 <div style="margin-top:14px">${button('Chọn chủ đề khác',"go('learn')",'secondary')}</div></div>`
}

];

function expertInterest(id){if(!expertState.interest.includes(id))expertState.interest.push(id);expertState.message='Đã lưu mối quan tâm trong bản mẫu này. Chưa gửi thông tin đến bất kỳ chuyên gia nào.';render()}

function finexpert(){const filters=['Tất cả','Đầu tư','Ngân hàng','Bảo hiểm'];const courses=expertCourses.filter(c=>expertState.filter==='Tất cả'||c.category===expertState.filter);return `${topbar('FinExpert','HỌC CÙNG CHUYÊN GIA')}<div class="screen"><div class="expert-hero"><div class="label">FINSMART · HỌC SÂU HƠN</div><h2>Học từ chuyên gia.<br>Ứng dụng vào cuộc sống.</h2><p>Học miễn phí trên FinSmart để mở ưu đãi cho các khóa chuyên sâu.</p><div class="expert-stars">✦ 🎓 ✦</div></div><div class="card"><div class="between"><b>Phần thưởng học tập</b><span class="chip">${investPoints()}/${INVEST_REWARD_POINTS} điểm đầu tư</span></div><p class="small muted">Hoàn thành bài học để mở khóa ưu đãi khóa học. Giá và mức giảm dưới đây chỉ để thử nghiệm ý tưởng.</p><div class="progress"><div style="width:${Math.min(100,investPoints()/INVEST_REWARD_POINTS*100)}%"></div></div>${button('Xem hành trình học tập',"go('journey')",'secondary')}</div><h3>Khóa học để khám phá</h3><div class="expert-filters">${filters.map(f=>`<button class="pill ${expertState.filter===f?'active':''}" onclick="expertFilter('${f}')">${f}</button>`).join('')}</div>${courses.map(c=>`<div class="expert-course-card"><div class="expert-course-head"><span class="expert-course-icon">${c.icon}</span><div><span class="chip">${c.category}</span><h3>${c.title}</h3><p class="small muted">${c.name}</p></div></div><p class="small muted">${c.duration} · ${c.description}</p><div class="expert-prices"><span>Giá mẫu <b>${expertPrice(c.price)}</b></span><strong>${expertReward(c)?`Đã mở -${c.discount}%`:`🔒 -${c.discount}% sau khi học`}</strong></div>${button('Xem khóa học mẫu',`expertDetail(${c.id})`,'secondary')}</div>`).join('')}<p class="note">Tất cả giảng viên, khóa học, giá, ưu đãi và nội dung trên trang này là ví dụ minh họa. Chưa có đối tác, thanh toán hay đăng ký thật.</p></div>`}
function expertDetailPage(){const c=expertCourses[expertState.course],unlocked=expertReward(c),discountPrice=Math.round(c.price*(1-c.discount/100));return `${topbar('Chi tiết FinExpert','KHÓA HỌC MẪU')}<div class="screen"><div class="expert-hero"><span class="expert-course-icon">${c.icon}</span><h2>${c.title}</h2><p>${c.name}</p></div><div class="card"><span class="chip">${c.category}</span><p>${c.description}</p><p class="small muted">${c.duration}</p><h3>Bạn sẽ tìm hiểu</h3><ul>${c.skills.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>Ưu đãi học tập FinSmart</h3><p class="small muted">Giá minh họa</p><div class="expert-price-big">${expertPrice(c.price)}</div><p>Giảm <b>${c.discount}%</b> sau khi đạt mốc học tập yêu cầu.</p>${unlocked?`<div class="notice success"><b>✓ Đã mở khóa ưu đãi</b><p>Giá sau giảm: <b>${expertPrice(discountPrice)}</b></p></div>`:`<div class="notice"><b>🔒 Chưa mở khóa</b><p>${c.id===0?`Bạn có ${investPoints()}/${INVEST_REWARD_POINTS} điểm. Hoàn thành ${Math.ceil(Math.max(0,INVEST_REWARD_POINTS-investPoints())/POINTS_PER_LESSON)} bài đầu tư còn lại để mở ưu đãi.`:`Hoàn thành bài “${learningTracks[c.unlock].name}” để thử mở ưu đãi này.`}</p></div>`}</div>${button(expertState.interest.includes(c.id)?'Đã lưu quan tâm':'Tôi quan tâm khóa học này',`expertInterest(${c.id})`)}${expertState.message?`<div class="notice success" role="status">${expertState.message}</div>`:''}<div style="margin-top:10px">${button(unlocked?'Về danh sách khóa học':'Học để mở ưu đãi',unlocked?"go('finexpert')":"goJourney()",'secondary')}</div><div style="margin-top:10px">${button('← Quay lại FinExpert',"go('finexpert')",'secondary')}</div><p class="note">Thử nghiệm giao diện và chuyển đổi. Không thu thập dữ liệu, không bán khóa học, không chuyển thông tin cho đối tác.</p></div>`}

function gardenSvg(id,cls=''){return `<svg class="${cls}" viewBox="${id==='garden-sprout'?'0 0 220 220':'0 0 240 165'}" aria-hidden="true"><use href="#${id}"/></svg>`}

${[[228,21,78],[641,53,69],[48,236,73],[271,362,58],[675,333,79],[530,360,66],[88,523,83],[323,530,64],[565,535,70]].map(([x,y,w])=>`<use href="#garden-tree" x="${x}" y="${y}" width="${w}" height="${w*1.25}"/>`).join('')}${[[149,61,51],[39,381,63],[694,242,47],[239,599,74],[459,582,69],[709,473,55]].map(([x,y,w])=>`<use href="#garden-bush" x="${x}" y="${y}" width="${w}" height="${w/2}"/>`).join('')}

${[332,476].map(x=>`<path d="M${x} 302h35m-35 9h35" stroke="#dca464" stroke-width="7" stroke-linecap="round"/><path d="M${x+4} 315v10m27-10v10" stroke="#c08e55" stroke-width="4"/>`).join('')}</svg>
${[['budget','Ngân sách cá nhân','Quản lý thu chi','building-budget',state.completed?'✓':''],['expert','FinExpert','Học cùng chuyên gia','building-expert',expertReward(expertCourses[0])?'✓':''],['investment','Đầu tư','Tăng trưởng tài sản','building-invest',n===2?'✓':n?`${n*50}%`:'Mới'],['credit','Tín dụng và nợ','Vay và trả nợ','building-credit',''],['insurance','Bảo hiểm','Hiểu và chọn bảo hiểm','building-insurance','']].map(([id,t,sub,asset,badge])=>`<button class="map-place place-${id}" onclick="openGardenTopic('${id}')" aria-label="${t}${badge==='✓'?', đã hoàn thành':''}">${gardenSvg(asset)}<span class="place-caption"><strong>${t}</strong><small>${sub}</small><span class="place-enter">${id==='expert'?'Khám phá →':'Vào học →'}</span></span>${badge?`<span class="place-badge ${badge==='Mới'?'new':badge==='✓'?'done':'partial'}">${badge}</span>`:''}</button>`).join('')}</div>`}
let gardenTopic='budget',gardenNotice=false;
function openGardenTopic(id){if(id==='expert')go('finexpert');else if(id==='investment')goJourney();else{gardenTopic=id;go('topicJourney')}}
function topicJourney(){const budget=gardenTopic==='budget';const t=budget?'Ngân sách cá nhân':gardenTopic==='credit'?'Tín dụng và nợ':'Bảo hiểm';return `${topbar(t,'HÀNH TRÌNH HỌC TẬP')}<div class="screen">${budget?`<div class="journey-overview"><h2>${state.completed?'1 / 1':'0 / 1'} bài học hoàn thành</h2><p>Quỹ khẩn cấp và kế hoạch cho tháng lương đầu tiên.</p></div><div class="journey-lesson"><span class="journey-check ${state.completed?'checked':''}">${state.completed?'✓':'1'}</span><div class="journey-info"><strong>Ngân sách & quỹ khẩn cấp</strong><p class="small muted">Bài học ngắn và thực hành phân bổ thu nhập.</p>${button(state.completed?'Ôn lại bài học':'Bắt đầu học',"state.lessonStep=0;state.quizAnswer=null;state.quizChecked=false;go('lesson')",'secondary')}</div></div>`:`<div class="card"><h2>Chủ đề đang được xây dựng</h2><p>Nội dung ${t.toLowerCase()} chưa có trong bản mẫu này.</p>${button('Khám phá bài học hiện có',"go('learn')")}</div>`}${button('Về bản đồ học tập',"go('home')",'secondary')}</div>`}
function gardenTotalPoints(){return investPoints()+(state.completed?100:0)}
function home(){const done=state.trackDone.filter(Boolean).length,points=gardenTotalPoints(),ip=investPoints(),target=INVEST_REWARD_POINTS,remaining=Math.max(0,target-ip),lessons=done+(state.completed?1:0),topics=(done===2?1:0)+(state.completed?1:0),level=1+Math.floor(points/500),labDone=transactions.some(t=>t.type!=='income')||state.completed;return `${gardenDefs()}<div class="garden-home"><section class="garden-hero"><div class="garden-heading"><h1>Học và quản lý<br>tài chính thông minh</h1><p>Chọn chủ đề, học từng bước<br>và mở khóa ưu đãi từ FinExpert.</p></div>${gardenSvg('garden-sprout','hero-sprout')}<button class="garden-card growth-card" onclick="go('gardenProgress')"><strong>Khu vườn tài chính của bạn ${gi('arrow')}</strong><p>Cấp ${level} · ${level===1?'Mầm xanh':level===2?'Cây đang lớn':'Vườn xanh'} 🌱</p><div class="garden-progress"><span style="width:${points%500/5}%"></span></div><small>${points%500} / 500 điểm đến cấp tiếp theo</small></button><svg class="hero-hills" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46C90 4 135 85 280 51S420 4 500 32 649 47 720 17 850 5 927 24 1075 75 1200 24v46H0Z" fill="#def3d3"/></svg></section><p class="map-instruction">Chạm vào một địa điểm để bắt đầu học</p><div class="garden-body">${gardenMap()}<aside class="garden-panels"><button class="garden-card reward-card" onclick="expertDetail(0)"><h2>${gi('gift')} ${remaining?'Phần thưởng sắp mở khóa':'Phần thưởng đã mở khóa'}</h2><div class="reward-offer">${gi('expert')}<div><span>Ưu đãi khóa học FinExpert</span><strong>Giảm 30%</strong></div></div><div class="reward-meter"><p>${remaining?`Cần thêm ${remaining} điểm đầu tư`:'✓ Đã đạt mốc 200 điểm đầu tư'}</p><div class="garden-progress"><span style="width:${Math.min(100,ip/target*100)}%"></span></div></div><p class="garden-footnote">Ưu đãi mẫu để trải nghiệm.</p></button><section class="garden-card achievement-card"><h2>${gi('award')} Thành tích</h2><div class="garden-stats"><div><span>🌱</span><strong>${topics}</strong><small>chủ đề</small></div><div><span>📖</span><strong>${lessons}</strong><small>bài học</small></div><div><span>⭐</span><strong>${points}</strong><small>điểm</small></div></div></section></aside></div><section class="garden-resume"><h2>${gi('play')} ${done===2?'Ôn lại hành trình học':'Tiếp tục hành trình học'}</h2><div class="garden-card resume-card"><div class="resume-art">${gardenSvg('building-invest')}</div><div class="resume-detail"><h3>Đầu tư cơ bản</h3><p>${done===2?'Bạn đã hoàn thành 2 bài học':done===1?'Bài 2: Cổ phiếu & rủi ro':'Bài 1: Đầu tư & tiết kiệm'}</p><div class="resume-progress"><div class="garden-progress"><span style="width:${done*50}%"></span></div><span>${done} / 2 bài học</span></div></div><button class="garden-cta" onclick="goJourney()">${done===2?'Xem hành trình':'Tiếp tục'} ${gi('arrow')}</button></div></section></div>`}
function gardenProgress(){const p=gardenTotalPoints();return `${topbar('Khu vườn tài chính','TIẾN ĐỘ CỦA BẠN')}<div class="screen">${gardenDefs()}${gardenSvg('garden-sprout','progress-sprout')}<h2>Cấp ${1+Math.floor(p/500)} · ${p} điểm</h2><p>Mỗi bài đầu tư hoàn thành mang lại 100 điểm. Hoàn thành thử thách ngân sách nhận thêm 100 điểm.</p><div class="notice">Ưu đãi đầu tư FinExpert mở khóa khi hoàn thành 2 bài đầu tư, đạt ${INVEST_REWARD_POINTS} điểm đầu tư.</div>${button('Xem hành trình đầu tư',"goJourney()")}</div>`}
function gardenHeader(){const active=['home','gardenProgress'].includes(state.page)?'home':['labhome','lab','portfolio','account','transfer','result'].includes(state.page)?'labhome':['finexpert','expertDetail'].includes(state.page)?'finexpert':'learn';return `<a class="garden-brand" href="#" onclick="go('home');return false"><span>🌱</span>FinSmart 10</a><nav aria-label="Điều hướng chính">${[['home','home','Trang chủ'],['learn','book','Học'],['labhome','lab','Money Lab'],['finexpert','expert','FinExpert']].map(([p,ic,t])=>`<button class="${active===p?'active':''}" onclick="go('${p}')" ${active===p?'aria-current="page"':''}>${gi(ic)}<span>${t}</span></button>`).join('')}</nav><div class="garden-tools"><button aria-label="Thông báo" onclick="gardenNotice=!gardenNotice;render()">${gi('bell')}</button><button class="garden-profile" aria-label="Chân dung tài chính" onclick="go('selfie')"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="13" r="7" fill="white"/><path d="M6 35c0-16 28-16 28 0" fill="white"/></svg></button></div>${gardenNotice?'<div class="garden-notification" role="status">Chưa có thông báo mới. Tiếp tục học để mở ưu đãi FinExpert.</div>':''}`}
// Keep lesson progress across reloads without changing the existing assessment flow.
try{const saved=JSON.parse(localStorage.getItem('finsmart-garden-v1')||'null');if(saved){if(Array.isArray(saved.trackDone)&&saved.trackDone.length===2)state.trackDone=saved.trackDone.map(x=>x===true);state.completed=saved.completed===true;state.points=state.completed?100:0;}}catch(e){}
const originalRender=render;
render=function(){if(state.page==='topicJourney'||state.page==='gardenProgress'){document.getElementById('appview').innerHTML=state.page==='topicJourney'?topicJourney():gardenProgress();}else originalRender();document.body.classList.toggle('garden-is-home',state.page==='home');document.getElementById('garden-header').innerHTML=gardenHeader();try{localStorage.setItem('finsmart-garden-v1',JSON.stringify({trackDone:state.trackDone,completed:state.completed}));}catch(e){}};

render();
